<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- "Aurora Prompt" mark: a dark terminal window with a prompt chevron and
       cursor on a violet→pink→amber tile. Tile inset + radius follow the
       macOS Big Sur icon grid (824pt tile @1024). Source of truth for the
       canvas lab in brand/app-icon.html (variant A). -->
  <defs>
    <linearGradient id="tile" x1="100" y1="100" x2="924" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7B61FF"/>
      <stop offset="0.55" stop-color="#FF5FA2"/>
      <stop offset="1" stop-color="#FFB547"/>
    </linearGradient>
    <radialGradient id="sheen" cx="260" cy="180" r="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="prompt" x1="300" y1="440" x2="400" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3FDD8C"/>
      <stop offset="1" stop-color="#4CC9F0"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#3C0A46" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <rect x="206" y="250" width="612" height="500" rx="76" fill="#15151C" filter="url(#lift)"/>
  <circle cx="284" cy="326" r="20" fill="#FF5F57"/>
  <circle cx="346" cy="326" r="20" fill="#FEBC2E"/>
  <circle cx="408" cy="326" r="20" fill="#28C840"/>
  <path d="M300 440 L400 540 L300 640" fill="none" stroke="url(#prompt)" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="452" y="590" width="190" height="52" rx="26" fill="#F6F1E7"/>
</svg>
