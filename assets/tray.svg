<svg width="96" height="96" viewBox="194 182 636 636" xmlns="http://www.w3.org/2000/svg">
  <!-- Template (alpha-only) tray glyph: the terminal window of app-icon.svg,
       same coordinates, with the viewBox cropped to the window. Template
       images keep alpha and drop color, so the prompt is knocked out of a
       solid window instead of drawn over it. -->
  <defs>
    <mask id="prompt-cut">
      <rect x="194" y="182" width="636" height="636" fill="#fff"/>
      <path d="M300 440 L400 540 L300 640" fill="none" stroke="#000" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="452" y="590" width="190" height="52" rx="26" fill="#000"/>
    </mask>
  </defs>
  <rect x="206" y="250" width="612" height="500" rx="76" fill="#000" mask="url(#prompt-cut)"/>
</svg>
