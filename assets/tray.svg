      <rect x="190" y="244" width="554" height="554" fill="#fff"/>
      <rect x="212" y="396" width="420" height="340" rx="64" fill="#000" stroke="#000" stroke-width="32"/>
    </mask>
    <mask id="prompt-cut" maskUnits="userSpaceOnUse" x="190" y="244" width="554" height="554">
